<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হাদিয়ার ময়নাতদন্ত</title>
    <!-- বাংলা ফন্ট (কালপুরুষ/নিকোষ) -->
    <link href="https://fonts.googleapis.com/css2?family=Kalpurush&family=Nikosh&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kalpurush', 'Nikosh', Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #16a085;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .content {
            padding: 15px;
            flex: 1;
        }
        .btn {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-family: 'Kalpurush', sans-serif;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-primary { background-color: #16a085; color: white; }
        .btn-print { background-color: #2980b9; color: white; }
        .btn-copy { background-color: #d35400; color: white; }
        .btn-danger { background-color: #c0392b; color: white; }
        .btn-folder { background-color: #8e44ad; color: white; }

        /* পপআপ মডাল */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-card h3 { margin-top: 0; color: #16a085; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            font-family: 'Kalpurush', sans-serif;
            border: 2px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #16a085; }
        .modal-btns { display: flex; gap: 10px; }

        /* টেবিল ডিজাইন */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #bdc3c7;
            padding: 8px;
            text-align: center;
        }
        th { background-color: #16a085; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }

        .action-btns button {
            padding: 3px 6px;
            font-size: 11px;
            border-radius: 3px;
            border: none;
            cursor: pointer;
            color: white;
        }
        .edit-btn { background-color: #f39c12; }
        .del-btn { background-color: #e74c3c; }

        /* হিস্টোরি ফোল্ডার সেকশন */
        .history-section {
            display: none;
            margin-top: 15px;
        }

        /* প্রিন্ট স্টাইল: ১ পাতায় সুপার ও ডিএএফও দুটি ভাগে দেখাবে */
        .print-receipt-container { display: none; }
        
        @media print {
            body { background: white; padding: 0; }
            .app-container, header, .no-print, .modal-overlay { display: none !important; }
            
            .print-receipt-container {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                height: 98vh;
                box-sizing: border-box;
                padding: 10px;
                page-break-after: always;
            }
            .receipt-box {
                border: 2px dashed #000;
                padding: 15px;
                border-radius: 8px;
                height: 46%;
                box-sizing: border-box;
            }
            .receipt-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 2px solid #000;
                padding-bottom: 8px;
                margin-bottom: 10px;
            }
            .receipt-header h2 { margin: 0; font-size: 18px; }
            .receipt-body table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
            .receipt-body th, .receipt-body td { border: 1px solid #000; padding: 6px; text-align: center; }
            .receipt-body th { background: #eee; color: #000; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>হাদিয়া</header>

    <div class="content">
        <button class="btn btn-primary" onclick="openStep(1)">+ নতুন এন্ট্রি যোগ করুন</button>
        <button class="btn btn-folder" onclick="toggleHistoryFolder()">📁 হিস্টোরি ফোল্ডার (১ মাস)</button>
        
        <div style="display: flex; gap: 5px; margin-top: 10px;" class="no-print">
            <button class="btn btn-print" onclick="window.print()" style="flex:1;">🖨️ প্রিন্ট (২ ভাগ)</button>
            <button class="btn btn-copy" onclick="copyTableForMSWord()" style="flex:1;">📋 কপি</button>
            <button class="btn btn-danger" onclick="clearAllData()" style="flex:1;">🗑️ মুছুন</button>
        </div>

        <!-- মূল ড্যাশবোর্ড টেবিল -->
        <div class="table-responsive">
            <table id="resultTable">
                <thead>
                    <tr>
                        <th>অফিসের নাম</th>
                        <th>মোট বিল</th>
                        <th>লেকশন</th>
                        <th>সুপার (২০%)</th>
                        <th>ডিএএফও (৩০%)</th>
                        <th class="no-print">অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
                <tfoot>
                    <tr style="font-weight: bold; background: #e8f8f5;">
                        <td style="text-align: right;">মোট:</td>
                        <td id="sumBill">০</td>
                        <td id="sumCollection">০</td>
                        <td id="sumSuper">০</td>
                        <td id="sumDafo">০</td>
                        <td class="no-print"></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- হিস্টোরি ফোল্ডার ভিউ -->
        <div class="history-section" id="historySection">
            <h3 style="color: #8e44ad; text-align: center; margin-bottom: 5px;">হিস্টোরি ফোল্ডার (গত ১ মাস)</h3>
            <div class="table-responsive">
                <table id="historyTable">
                    <thead>
                        <tr>
                            <th>তারিখ</th>
                            <th>অফিসের নাম</th>
                            <th>লেকশন</th>
                            <th>সুপার</th>
                            <th>ডিএএফও</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
            <button class="btn btn-primary" onclick="toggleHistoryFolder()" style="margin-top: 10px;">ড্যাশবোর্ডে ফিরে যান</button>
        </div>
    </div>
</div>

<!-- স্লাইড বাই স্লাইড পপআপ মডাল -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
        <h3 id="modalTitle">তথ্য এন্ট্রি</h3>
        <input type="hidden" id="editIndex" value="">

        <div class="modal-step" id="step1">
            <div class="form-group">
                <label>অফিসের নাম লিখুন:</label>
                <input type="text" id="popupOffice" placeholder="যেমন: পরিবেশ অধিদপ্তর">
            </div>
            <div class="modal-btns">
                <button class="btn btn-danger" onclick="closeModal()">বাতিল</button>
                <button class="btn btn-primary" onclick="nextStep(2)">পরবর্তী</button>
            </div>
        </div>

        <div class="modal-step" id="step2" style="display:none;">
            <div class="form-group">
                <label>মোট টাকার বিল:</label>
                <input type="number" id="popupBill" placeholder="যেমন: ১০০০০">
            </div>
            <div class="modal-btns">
                <button class="btn btn-danger" onclick="nextStep(1)">পূর্ববর্তী</button>
                <button class="btn btn-primary" onclick="nextStep(3)">পরবর্তী</button>
            </div>
        </div>

        <div class="modal-step" id="step3" style="display:none;">
            <div class="form-group">
                <label>ক্যাশ সরকার হতে কালেকশন:</label>
                <input type="number" id="popupCollection" placeholder="যেমন: ২০০০">
            </div>
            <div class="modal-btns">
                <button class="btn btn-danger" onclick="nextStep(2)">পূর্ববর্তী</button>
                <button class="btn btn-primary" onclick="savePopupData()">সংরক্ষণ করুন</button>
            </div>
        </div>
    </div>
</div>

<!-- প্রিন্ট করার জন্য ১ পাতায় দুটি ভাগ (সুপার ও ডিএএফও স্লিপ) -->
<div class="print-receipt-container" id="printContainer">
    <!-- উপরের অংশ: সুপার স্লিপ -->
    <div class="receipt-box">
        <div class="receipt-header">
            <h2>হাদিয়া - সুপার (২০%)</h2>
            <div id="printDate1" style="font-size: 13px; font-weight: bold;"></div>
        </div>
        <div class="receipt-body">
            <table>
                <thead>
                    <tr>
                        <th>অফিসের নাম</th>
                        <th>লেকশন</th>
                        <th>সুপার ভাগ (২০%)</th>
                    </tr>
                </thead>
                <tbody id="printSuperBody"></tbody>
            </table>
        </div>
    </div>

    <!-- নিচের অংশ: ডিএএফও স্লিপ -->
    <div class="receipt-box">
        <div class="receipt-header">
            <h2>হাদিয়া - ডিএএফও (৩০%)</h2>
            <div id="printDate2" style="font-size: 13px; font-weight: bold;"></div>
        </div>
        <div class="receipt-body">
            <table>
                <thead>
                    <tr>
                        <th>অফিসের নাম</th>
                        <th>লেকশন</th>
                        <th>ডিএএফও ভাগ (৩০%)</th>
                    </tr>
                </thead>
                <tbody id="printDafoBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let entries = JSON.parse(localStorage.getItem('hadiya_data')) || [];

    function toBengaliNum(num) {
        if (isNaN(num)) return '০';
        const numStr = Number(num).toFixed(2).replace(/\.00$/, '');
        const bengaliDigits = {'0':'০', '1':'১', '2':'২', '3':'৩', '4':'৪', '5':'৫', '6':'৬', '7':'৭', '8':'৮', '9':'৯', '.':'.'};
        return numStr.toString().split('').map(char => bengaliDigits[char] !== undefined ? bengaliDigits[char] : char).join('');
    }

    function cleanOldData() {
        const oneMonthAgo = new Date();
        oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1);
        entries = entries.filter(item => new Date(item.date) >= oneMonthAgo);
        localStorage.setItem('hadiya_data', JSON.stringify(entries));
    }

    function openStep(step) {
        document.getElementById('modalOverlay').style.display = 'flex';
        showStep(step);
    }

    function showStep(step) {
        document.getElementById('step1').style.display = step === 1 ? 'block' : 'none';
        document.getElementById('step2').style.display = step === 2 ? 'block' : 'none';
        document.getElementById('step3').style.display = step === 3 ? 'block' : 'none';
        
        if(step === 1) document.getElementById('popupOffice').focus();
        if(step === 2) document.getElementById('popupBill').focus();
        if(step === 3) document.getElementById('popupCollection').focus();
    }

    function nextStep(step) {
        if(step === 2 && !document.getElementById('popupOffice').value.trim()) {
            alert('দয়া করে অফিসের নাম লিখুন!');
            return;
        }
        if(step === 3 && !document.getElementById('popupBill').value) {
            alert('দয়া করে মোট বিলের পরিমাণ দিন!');
            return;
        }
        showStep(step);
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
        resetPopupForm();
    }

    function resetPopupForm() {
        document.getElementById('popupOffice').value = '';
        document.getElementById('popupBill').value = '';
        document.getElementById('popupCollection').value = '';
        document.getElementById('editIndex').value = '';
        document.getElementById('modalTitle').innerText = "তথ্য এন্ট্রি";
    }

    function savePopupData() {
        const officeName = document.getElementById('popupOffice').value.trim();
        const totalBill = parseFloat(document.getElementById('popupBill').value);
        const collection = parseFloat(document.getElementById('popupCollection').value);
        const editIndex = document.getElementById('editIndex').value;

        if (!officeName || isNaN(totalBill) || isNaN(collection)) {
            alert('সব তথ্য সঠিকভাবে দিন!');
            return;
        }

        const superShare = collection * 0.20;
        const dafoShare = collection * 0.30;
        const date = new Date().toISOString().split('T')[0];

        const entryObj = { date, officeName, totalBill, collection, superShare, dafoShare };

        if (editIndex === "") {
            entries.push(entryObj);
        } else {
            entries[editIndex] = entryObj;
        }

        localStorage.setItem('hadiya_data', JSON.stringify(entries));
        closeModal();
        renderTable();
    }

    function toggleHistoryFolder() {
        const historySec = document.getElementById('historySection');
        const mainTable = document.querySelector('.table-responsive');
        if(historySec.style.display === 'block') {
            historySec.style.display = 'none';
            mainTable.style.display = 'block';
        } else {
            historySec.style.display = 'block';
            mainTable.style.display = 'none';
            renderHistoryTable();
        }
    }

    function renderTable() {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';

        let totalBillSum = 0, totalCollSum = 0, totalSuperSum = 0, totalDafoSum = 0;

        entries.forEach((item, index) => {
            totalBillSum += item.totalBill;
            totalCollSum += item.collection;
            totalSuperSum += item.superShare;
            totalDafoSum += item.dafoShare;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.officeName}</td>
                <td>${toBengaliNum(item.totalBill)} টাকা</td>
                <td>${toBengaliNum(item.collection)} টাকা</td>
                <td>${toBengaliNum(item.superShare)} টাকা</td>
                <td>${toBengaliNum(item.dafoShare)} টাকা</td>
                <td class="no-print action-btns">
                    <button class="edit-btn" onclick="editEntry(${index})">এডিট</button>
                    <button class="del-btn" onclick="deleteEntry(${index})">মুছুন</button>
                </td>
            `;
            tableBody.appendChild(row);
        });

        document.getElementById('sumBill').innerText = toBengaliNum(totalBillSum) + ' টাকা';
        document.getElementById('sumCollection').innerText = toBengaliNum(totalCollSum) + ' টাকা';
        document.getElementById('sumSuper').innerText = toBengaliNum(totalSuperSum) + ' টাকা';
        document.getElementById('sumDafo').innerText = toBengaliNum(totalDafoSum) + ' টাকা';

        preparePrintData();
    }

    function renderHistoryTable() {
        const historyBody = document.getElementById('historyTableBody');
        historyBody.innerHTML = '';
        entries.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.date}</td>
                <td>${item.officeName}</td>
                <td>${toBengaliNum(item.collection)} টাকা</td>
                <td>${toBengaliNum(item.superShare)} টাকা</td>
                <td>${toBengaliNum(item.dafoShare)} টাকা</td>
            `;
            historyBody.appendChild(row);
        });
    }

    function preparePrintData() {
        const superBody = document.getElementById('printSuperBody');
        const dafoBody = document.getElementById('printDafoBody');
        superBody.innerHTML = '';
        dafoBody.innerHTML = '';

        entries.forEach(item => {
            superBody.innerHTML += `<tr><td>${item.officeName}</td><td>${toBengaliNum(item.collection)} টাকা</td><td>${toBengaliNum(item.superShare)} টাকা</td></tr>`;
            dafoBody.innerHTML += `<tr><td>${item.officeName}</td><td>${toBengaliNum(item.collection)} টাকা</td><td>${toBengaliNum(item.dafoShare)} টাকা</td></tr>`;
        });

        const today = new Date();
        const dateStr = toBengaliNum(today.getDate()) + '/' + toBengaliNum(today.getMonth() + 1) + '/' + toBengaliNum(today.getFullYear());
        document.getElementById('printDate1').innerText = "তারিখ: " + dateStr;
        document.getElementById('printDate2').innerText = "তারিখ: " + dateStr;
    }

    function editEntry(index) {
        const item = entries[index];
        document.getElementById('popupOffice').value = item.officeName;
        document.getElementById('popupBill').value = item.totalBill;
        document.getElementById('popupCollection').value = item.collection;
        document.getElementById('editIndex').value = index;
        document.getElementById('modalTitle').innerText = "তথ্য এডিট করুন";
        openStep(1);
    }

    function deleteEntry(index) {
        if (confirm('মুছে ফেলতে চান?')) {
            entries.splice(index, 1);
            localStorage.setItem('hadiya_data', JSON.stringify(entries));
            renderTable();
        }
    }

    function clearAllData() {
        if (confirm('সকল ডাটা মুছে ফেলতে চান?')) {
            entries = [];
            localStorage.removeItem('hadiya_data');
            renderTable();
        }
    }

    function copyTableForMSWord() {
        const table = document.getElementById('resultTable');
        const cloneTable = table.cloneNode(true);
        cloneTable.querySelectorAll('.no-print').forEach(el => el.remove());

        let range = document.createRange();
        range.selectNode(cloneTable);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        
        try {
            document.execCommand('copy');
            alert('কপি হয়েছে! MS Word এ পেস্ট করুন।');
        } catch (err) {
            alert('কপি করতে সমস্যা হয়েছে।');
        }
        window.getSelection().removeAllRanges();
    }

    window.onload = function() {
        cleanOldData();
        renderTable();
    };
</script>

</body>
</html>
